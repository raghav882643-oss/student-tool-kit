```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpark</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎓 StudySpark</h1>
        <p>Simple tools for smarter studying</p>
    </header>

    <main>

        <!-- Calculator -->
        <section class="card">
            <h2>🧮 Calculator</h2>

            <input type="number" id="num1" placeholder="First number">
            <input type="number" id="num2" placeholder="Second number">

            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>

            <h3 id="result">Result: —</h3>
        </section>


        <!-- Study Timer -->
        <section class="card">
            <h2>⏱️ Study Timer</h2>

            <div id="timer">25:00</div>

            <button onclick="startTimer()">Start</button>
            <button onclick="resetTimer()">Reset</button>
        </section>


        <!-- Quick Notes -->
        <section class="card">
            <h2>📝 Quick Notes</h2>

            <textarea id="notes" placeholder="Write your notes here..."></textarea>

            <button onclick="saveNotes()">Save Notes</button>

            <p id="saved">Not saved yet</p>
        </section>


        <!-- Exam Countdown -->
        <section class="card">
            <h2>⏳ Exam Countdown</h2>

            <input type="text" id="examName" placeholder="Exam name">

            <label for="examDate">Select exam date:</label>
            <input type="datetime-local" id="examDate">

            <button onclick="startCountdown()">Start Countdown</button>

            <h3 id="countdownTitle">Your countdown will appear here</h3>

            <div id="countdown">
                <div>
                    <span id="days">0</span>
                    <small>Days</small>
                </div>

                <div>
                    <span id="hours">0</span>
                    <small>Hours</small>
                </div>

                <div>
                    <span id="minutes">0</span>
                    <small>Minutes</small>
                </div>

                <div>
                    <span id="seconds">0</span>
                    <small>Seconds</small>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>Made by Raghav</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
```
